# Mihari Vector Configuration - Nginx
# Collects Nginx access/error logs, exporter metrics and host metrics
#
# Variables (replaced by setup script):
#   __INGESTION_URL__ - Your Mihari instance URL
#   __SOURCE_TOKEN__  - Bearer token for authentication
#
# Log event contract (top-level fields read by the Mihari ingest parser):
#   message   - the log line (error-log prefix stripped when parseable)
#   level     - access log: info (<400), warn (4xx), error (5xx);
#               error log: the nginx severity word, normalised
#   timestamp - event time. Never renamed; overwritten from the access-log
#               timestamp (which carries a UTC offset) when parseable.
#   service   - always "nginx"
#   host      - machine hostname
# Any other top-level key (http_method, http_path, http_status, client_ip,
# pid, ...) is stored as a searchable string attribute.
#
# Metrics: scrapes nginx-prometheus-exporter on its default port 9113
# (https://github.com/nginx/nginx-prometheus-exporter).

api:
  enabled: true
  address: "127.0.0.1:8686"

sources:
  mihari_nginx_access_logs:
    type: file
    include:
      - "/var/log/nginx/access.log"
    read_from: beginning
    ignore_older_secs: 600

  mihari_nginx_error_logs:
    type: file
    include:
      - "/var/log/nginx/error.log"
    read_from: beginning
    ignore_older_secs: 600

  mihari_nginx_metrics:
    type: prometheus_scrape
    endpoints:
      - "http://127.0.0.1:9113/metrics"
    scrape_interval_secs: 30

  mihari_host_metrics:
    type: host_metrics
    collectors: [cpu, disk, filesystem, load, host, memory, network]
    scrape_interval_secs: 30

transforms:
  mihari_nginx_access_parser:
    type: remap
    inputs: [mihari_nginx_access_logs]
    source: |
      del(.source_type)
      del(.file)
      .service = "nginx"
      .host = get_hostname!()
      # Combined log format:
      # remote_addr - remote_user [time_local] "request" status body_bytes_sent "referer" "user_agent"
      parsed, err = parse_regex(.message, r'^(?P<client>\S+) \S+ (?P<user>\S+) \[(?P<ts>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+)(?: (?P<protocol>[^"]*))?" (?P<status>\d{3}) (?P<bytes>\d+|-)(?: "(?P<referer>[^"]*)" "(?P<agent>[^"]*)")?')
      if err == null {
        status = to_int(parsed.status) ?? 0
        .level = if status >= 500 { "error" } else if status >= 400 { "warn" } else { "info" }
        .http_method = parsed.method
        .http_path = parsed.path
        .http_status = parsed.status
        .client_ip = parsed.client
        if parsed.bytes != null && parsed.bytes != "-" { .bytes_sent = parsed.bytes }
        if parsed.referer != null && parsed.referer != "-" { .http_referer = parsed.referer }
        if parsed.agent != null && parsed.agent != "-" { .http_user_agent = parsed.agent }
        .timestamp = parse_timestamp(string(parsed.ts) ?? "", format: "%d/%b/%Y:%H:%M:%S %z") ?? .timestamp
      } else {
        .level = "info"
      }

  mihari_nginx_error_parser:
    type: remap
    inputs: [mihari_nginx_error_logs]
    source: |
      del(.source_type)
      del(.file)
      .service = "nginx"
      .host = get_hostname!()
      # Error log format: YYYY/MM/DD HH:MM:SS [level] pid#tid: *cid message
      parsed, err = parse_regex(.message, r'^(?P<ts>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?:\*(?P<cid>\d+) )?(?P<msg>.*)')
      if err == null {
        lvl = downcase(string(parsed.level) ?? "error")
        if lvl == "warning" { lvl = "warn" }
        if lvl == "notice" { lvl = "info" }
        if lvl == "crit" || lvl == "alert" { lvl = "error" }
        if lvl == "emerg" { lvl = "fatal" }
        .level = lvl
        .pid = parsed.pid
        if parsed.cid != null { .connection_id = parsed.cid }
        .message = string(parsed.msg) ?? .message
      } else {
        .level = "error"
      }

sinks:
  mihari_logs_sink:
    type: http
    inputs: [mihari_nginx_access_parser, mihari_nginx_error_parser]
    uri: "__INGESTION_URL__/v1/ingest/vector"
    method: post
    encoding:
      codec: json
    compression: gzip
    auth:
      strategy: bearer
      token: "__SOURCE_TOKEN__"
    batch:
      max_bytes: 1048576
      timeout_secs: 1

  mihari_metrics_sink:
    type: prometheus_remote_write
    inputs: [mihari_nginx_metrics, mihari_host_metrics]
    endpoint: "__INGESTION_URL__/v1/ingest/prometheus"
    auth:
      strategy: bearer
      token: "__SOURCE_TOKEN__"
    batch:
      max_bytes: 1048576
      timeout_secs: 5
